<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My watchlist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
<h1>My watchlist</h1>
<p class="sub">Sign in with your email and password. This device will remember you.</p>
<div class="row"><input id="em" type="email" placeholder="you@email.com"><input id="pw" type="password" placeholder="Password"><button id="send" class="pri">Sign in</button></div>
<p class="err" id="lmsg"></p>
</div>
<div class="app" id="app" hidden>
<aside id="side"></aside>
<main>
<div class="top">
<div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
<div class="row">
<button id="pickBtn" class="pri">Pick for me</button>
<button id="addBtn">Add title</button>
<button id="thBtn">Dark mode</button>
<button id="out">Sign out</button>
</div>
</div>
<div class="panel pick" id="pick" hidden></div>
<div class="panel" id="listForm" hidden>
<div class="row"><input id="ln" type="text" placeholder="List name, like Anime" maxlength="24"><button id="lsave" class="pri">Create list</button><span class="err" id="lerr"></span></div>
</div>
<div class="panel" id="form" hidden>
<div class="grid">
<input id="fn" type="text" placeholder="Name">
<input id="fg" type="text" placeholder="Genre">
<select id="fr"><option>Best</option><option>Above average</option><option selected>Good</option><option>Average</option><option>Bad</option></select>
<select id="fs"><option value="planned">Plan to watch</option><option value="continuing">Continuing</option><option value="watched">Watched</option></select>
<input id="fp" type="number" min="0" placeholder="Episodes watched">
<input id="ft" type="number" min="1" placeholder="Total episodes">
</div>
<input id="fd" type="text" placeholder="Short description or your own note" style="width:100%;margin-top:8px">
<div class="row" style="margin-top:10px"><button id="save" class="pri">Save</button><button id="cancel">Cancel</button><span class="err" id="err"></span></div>
</div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="bar">
<input id="q" type="text" placeholder="Search by name" aria-label="Search">
<select id="g" aria-label="Genre"></select>
<select id="o" aria-label="Sort"><option value="added">Sort: added</option><option value="rating">Sort: rating</option><option value="name">Sort: name</option><option value="fav">Sort: favorites</option></select>
</div>
<div class="wrap"><table>
<thead><tr><th>No.</th><th>Name</th><th>Rating</th><th>Genre</th><th>Progress</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table><div class="empty" id="empty" hidden>Nothing here yet. Press Add title to start your list.</div></div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
